<style>
/* Layout: slim status strip, a 3D arena window with touch controls over its lower corners, a bar of power buttons below.

:root{

  const body=lmat(T.body),skin=lmat(T.skin);mats.push(body,skin);
  const eyeM=gmat(T.eye,1);
  const box=(w,h,d,m,x,y,z,par)=>{const o=new THREE.Mesh(GEO.box,m);o.scale.set(w,h,d);o.position.set(x,y,z);(par||g).add(o);return o};
  const hipG=new THREE.Group();hipG.position.y=.9*s;g.add(hipG);
  const legs=[-1,1].map(sd=>{const l=new THREE.Group();l.position.set(sd*.2*s,0,0);hipG.add(l);box(.24*s,.9*s,.26*s,skin,0,-.45*s,0,l);return l});
  const tor=new THREE.Group();hipG.add(tor);
  box(.78*s,.85*s,.42*s,body,0,.45*s,0,tor);
  box(.5*s,.25*s,.5*s,skin,0,.95*s,0,tor);
  const head=new THREE.Group();head.position.y=1.28*s;tor.add(head);
  box(.46*s,.46*s,.44*s,skin,0,0,0,head);
  box(.11*s,.06*s,.05*s,eyeM,-.12*s,.04*s,.23*s,head);box(.11*s,.06*s,.05*s,eyeM,.12*s,.04*s,.23*s,head);
  if(T.name==='Bruto'){for(const sd of[-1,1]){const h=new THREE.Mesh(GEO.cone,body);h.scale.set(.1*s,.4*s,.1*s);h.position.set(sd*.22*s,.3*s,0);h.rotation.z=-sd*.5;head.add(h)}}
  if(T.name==='Campeão'){for(let i=-2;i<=2;i++){const h=new THREE.Mesh(GEO.cone,eyeM);h.scale.set(.07*s,.35*s,.07*s);h.position.set(i*.09*s,.32*s,0);h.rotation.z=-i*.18;head.add(h)}}
  if(T.name==='Bruxo'){const hat=new THREE.Mesh(GEO.cone,body);hat.scale.set(.42*s,.75*s,.42*s);hat.position.y=.52*s;head.add(hat);const br=new THREE.Mesh(GEO.cyl,body);br.scale.set(.42*s,.08*s,.42*s);br.position.y=.22*s;head.add(br)}
  const arms=[-1,1].map(sd=>{const a=new THREE.Group();a.position.set(sd*.52*s,.8*s,0);tor.add(a);box(.2*s,.8*s,.22*s,skin,0,-.4*s,0,a);box(.3*s,.3*s,.3*s,body,0,-.85*s,0,a);return a});
  g.userData.mats=mats;
  return{g,hipG,legs,tor,head,arms,mats,eyeM};
}
function spawnEnemy(type,i,n,at){

  const e={type:T.base||type,T,kCd:rnd(3,5),id:++G.eid,x:at?at.x:sn(a)*r,y:0,z:at?at.z:cs(a)*r,vx:0,vz:0,vy:0,hp:T.hp*(1+.12*(G.round-1)),max:T.hp*(1+.12*(G.round-1)),dmgMul:1+.06*(G.round-1),para:0,spCd:rnd(2,5),slamR:4.6,castN:1,cx:0,cz:0,hitL:false,face:a+Math.PI,state:'move',st:0,atkCd:rnd(.8,1.8),slamCd:rnd(3,5),
    dead:false,gone:false,air:false,slam:false,burn:0,bt:0,wet:0,rad:0,rt:0,tox:0,tt:0,stun:0,slow:0,root:0,juggle:0,flash:0,ph:rnd(0,6),dieT:0,spawnT:.9,hit:0,

/* ---------- dano ---------- */
function hitEnemy(e,o){
  if(e.dead||e.gone||G.vis)return false;
  let dmg=(o.dmg||0)*(1+.08*((P.up&&P.up.dmg)||0));
  if(P.bf&&P.bf.sword)dmg*=1.4;
  if(P.el==='berserk'&&P.max)dmg*=1+Math.max(0,1-P.hp/P.max)*.5;
  if(P.up&&P.up.ls&&dmg>0)heal(dmg*.03*P.up.ls);
  if(e.puppet){
    e.hp=Math.max(1,e.hp-dmg);e.flash=.12;e.hit=.25;
    ptext(e.x+rnd(-.3,.3),e.y+2.2*e.T.scale,e.z,Math.round(dmg),o.col||'#fff',(o.big||dmg>=20)?21:15);
    if(o.label)callout(o.label,o.col2||'#ffe27a');
    puff(e.x,e.y+1.3,e.z,o.pc||(P.el?EL[P.el].hex:0xffffff),7,4.5,.35,.2,0);sfx(170,'square',.09,.05,-60);
    if(o.melee||o.combo){P.combo++;P.comboT=2.6}
    if(o.hs)hitstop(o.hs);
    MP.qHit(e,o,dmg);
    return true;
  }
  
  if(e.rad>0)dmg*=1.2;
  e.hp-=dmg;e.flash=.12;e.hit=.25;
  const L=Math.hypot(o.dirx||0,o.dirz||0)||1,dx=(o.dirx||0)/L,dz=(o.dirz||0)/L;
  if(o.knock){const k=o.knock/(e.T.mass*.8+.2);e.vx+=dx*k;e.vz+=dz*k}
  const armored=e.type==='boss'&&(e.state==='windup'||e.state==='strike'||e.state==='slamwind');
  if(o.stun&&!armored&&!(e.air&&!o.launch)){
    e.stun=Math.max(e.stun,o.stun*(e.type==='boss'?.5:1));
    if(e.state!=='air'&&e.state!=='down'){e.state='stagger'}
  }
  if(o.float){e.floatT=Math.max(e.floatT||0,o.float);e.air=true;e.state='air';e.vy=0;e.slam=false}
  if(o.launch&&!(e.floatT>0)){e.vy=o.launch/(e.T.mass>3?1.6:1);e.air=true;e.state='air';e.juggle=0;e.slam=false}
  else if(e.air&&!o.noJuggle&&e.juggle<8){e.vy=Math.max(e.vy,5.5);e.juggle++}
  if(o.burn){e.burn=Math.max(e.burn,o.burn);e.bt=Math.min(e.bt||.3,.3)}
  if(o.wet)e.wet=Math.max(e.wet,o.wet);
  if(o.charm){e.charm=Math.max(e.charm||0,o.charm);if(e.type!=='boss')e.stun=Math.max(e.stun,o.charm);if(e.state!=='air'&&e.state!=='down'&&e.type!=='boss')e.state='stagger'}
  if(o.rad)e.rad=Math.max(e.rad,o.rad);
  if(o.tox)e.tox=Math.max(e.tox,o.tox);
  if(o.slow)e.slow=Math.max(e.slow,o.slow);
  if(o.root)e.root=Math.max(e.root,o.root);
  if(o.para)e.para=Math.max(e.para,o.para);
  const big=o.big||dmg>=20;
  ptext(e.x+rnd(-.3,.3),e.y+2.2*e.T.scale,e.z,Math.round(dmg),o.col||'#fff',big?21:15);
  if(o.label)callout(o.label,o.col2||'#ffe27a');
  const c=P.el?EL[P.el].hex:0xffffff;
  puff(e.x,e.y+1.3,e.z,o.pc||c,big?14:7,big?7:4.5,.35,big?.3:.2,0);
  if(big)ringP(e.x,e.y+1.1,e.z,o.pc||c,1.8,10,.25,.2);
  sfx(big?120:170,'square',.09,.05,-60);
  if(o.melee||o.combo){P.combo++;P.comboT=2.6;passive(e,dmg)}
  if(o.hs)hitstop(o.hs);
  if(e.hp<=0)killEnemy(e);
  return true;
}
function dmgSilent(e,dmg,col){
  if(e.dead)return;
  e.hp-=dmg;e.flash=Math.max(e.flash,.06);
  if(Math.random()<.35)ptext(e.x+rnd(-.4,.4),e.y+2.1*e.T.scale,e.z,Math.round(dmg),col||'#ff9a3a',12);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return;
  e.dead=true;e.dieT=.8;e.state='dead';
  G.score+=Math.round(e.T.score*(1+Math.min(P.combo,20)*.05));
  puff(e.x,e.y+1.2,e.z,e.T.eye,22,7,.6,.35,0);puff(e.x,e.y+1.2,e.z,0xffffff,8,5,.3,.3,0);
  ringP(e.x,e.y+.5,e.z,e.T.eye,2.6,16,.4,.3);sfx(90,'sawtooth',.3,.07,-60);
  if(e.rad>0){
    for(const o of G.en){if(o.dead||o===e)continue;if(Math.hypot(o.x-e.x,o.z-e.z)<5.5){o.rad=Math.max(o.rad,4);beam(V(e.x,1.2,e.z),V(o.x,1.2,o.z),0x7dff2a,.08,.3,.7)}}
    puff(e.x,e.y+1,e.z,0x7dff2a,14,5,.6,.35,0);
  }
  if(e.burn>0)puff(e.x,e.y+1,e.z,0xff7a2b,14,4,.6,.4,-3);
  if(e.type==='boss'){hitstop(.25);shake(1);flashScreen('255,255,255',.5);banner(e.T.name.toUpperCase()+' DERROTADO','','#ffe27a')}
}
function hitPlayer(e,dmg,o){
  o=o||{};
  if(P.dead||P.inv>0||G.mode!=='fight')return false;
  const toE=Math.atan2(e.x-P.x,e.z-P.z),kx=sn(toE+Math.PI),kz=cs(toE+Math.PI);
  if(P.blocking&&(o.ring||Math.abs(angDiff(toE,P.face))<1.7)){
    if(P.blockT<.22){
      callout('Bloqueio perfeito!','#8ff0cf');sfx(660,'triangle',.2,.08,400);hitstop(.07);flashScreen('200,255,240',.2);
      ringP(P.x,P.y+1.2,P.z,0xffffff,2.6,14,.3,.25);P.guard=Math.min(P.guardMax,P.guard+25);
      if(!o.ring&&e.type!=='boss'){e.stun=Math.max(e.stun,.9);e.state='stagger'}
      e.vx+=sn(toE+Math.PI)*-4;e.vz+=cs(toE+Math.PI)*-4;
      return false;
    }
    const g=dmg*(P.el==='terra'?.8:1);P.guard-=g*1.2;
    sfx(220,'square',.12,.06,-40);puff(P.x+sn(toE)*.8,P.y+1.2,P.z+cs(toE)*.8,0xcfd6ff,8,4,.25,.2,0);
    P.vx+=kx*4;P.vz+=kz*4;shake(.15);
    if(P.guard<=0){
      P.guard=0;P.stun=.9;P.blocking=false;hs.block.clear();callout('Guarda quebrada!','#ff6a6a');
      P.hp-=g*.5;if(P.hp<=0){P.hp=0;die()}
    }else{P.hp-=g*.15;if(P.hp<=0){P.hp=0;die()}}
    return false;
  }
  const d=dmg*(P.el==='terra'?.8:1);
  P.hp-=d;P.inv=.5;P.stun=Math.max(P.stun,o.stun==null?.3:o.stun);P.act=null;P.flurry=null;P.dash=null;P.buf=null;P.combo=0;P.hurtA=1;
  P.vx=kx*(o.kb||7);P.vz=kz*(o.kb||7);if(o.up)P.vy=o.up;
  shake(.55);flashScreen('255,60,60',.35);ptext(P.x,P.y+2.5,P.z,'-'+Math.round(d),'#ff6a6a',19);
  puff(P.x,P.y+1.2,P.z,0xff4a4a,10,5,.35,.25,0);sfx(110,'sawtooth',.2,.08,-60);hitstop(.04);
  if(P.hp<=0){P.hp=0;die()}
  return true;
}

/* ---------- alvos (multijogador) ---------- */
function pickT(e){
  let b=P,bd=P.dead?1e9:Math.hypot(P.x-e.x,P.z-e.z);
  for(const q of MP.players){if(q.dead)continue;const d=Math.hypot(q.x-e.x,q.z-e.z);if(d<bd){bd=d;b=q}}
  return b;
}
function hitT(tg,e,dmg,o){return tg===P?hitPlayer(e,dmg,o):MP.hitRemote(tg,e,dmg,o)}

/* ---------- IA e física ---------- */
function updateEnemies(dt){
  let atk=0;
  for(const e of G.en)if(!e.dead&&(e.state==='windup'||e.state==='strike'||e.state==='slamwind'))atk++;
  G.attackers=atk;
  for(const e of G.en){
    if(e.gone)continue;
    const T=e.T;
    if(e.spawnT>0){e.spawnT-=dt;const k=1-Math.max(0,e.spawnT)/.9;e.g.scale.setScalar(Math.max(.01,easeOut(k)))}
    if(e.dead){
      e.dieT-=dt;const k=Math.max(0,e.dieT/.8);
      e.g.rotation.x=-(1-k)*1.3;e.g.scale.setScalar(Math.max(.01,k));e.g.position.y=e.y;
      e.rg.eyeM.opacity=k;
      if(e.dieT<=0)removeEnemy(e);
      continue;
    }
    if(e.puppet){MP.puppet(e,dt);continue}
    // status
    if(e.burn>0){e.burn-=dt;e.bt-=dt;if(e.bt<=0){e.bt=.5;dmgSilent(e,3.5,'#ff9a3a')}
      if(Math.random()<dt*30)trailP(e.x+rnd(-.3,.3),e.y+rnd(.3,2)*T.scale,e.z+rnd(-.3,.3),0xff7a2b,1,.35,.5,PA,.5)}
    if(e.rad>0){e.rad-=dt;e.rt-=dt;if(e.rt<=0){e.rt=.5;dmgSilent(e,2,'#7dff2a')}
      if(Math.random()<dt*20)trailP(e.x+rnd(-.3,.3),e.y+rnd(.3,2)*T.scale,e.z+rnd(-.3,.3),0x7dff2a,1,.3,.6,PA,.5)}
    if(e.tox>0){e.tox-=dt;e.tt-=dt;if(e.tt<=0){e.tt=.5;dmgSilent(e,3,'#b6ff6a')}
      if(Math.random()<dt*14)trailP(e.x+rnd(-.3,.3),e.y+rnd(.3,2)*T.scale,e.z+rnd(-.3,.3),0xa6ff4a,1,.28,.6,PN,.4)}
    if(e.charm>0){e.charm-=dt;if(Math.random()<dt*3)heartFloat(e.x+rnd(-.3,.3),e.y+(2.2+rnd(0,.4))*T.scale,e.z+rnd(-.3,.3),.26,0xff6ab8,1)}
    if(e.wet>0){e.wet-=dt;if(Math.random()<dt*10)trailP(e.x+rnd(-.3,.3),e.y+rnd(.5,2)*T.scale,e.z+rnd(-.3,.3),0x2ec8ff,1,.22,.5,PA,.3)}
    if(e.dead)continue;
    e.spCd=Math.max(0,e.spCd-dt);e.kCd=Math.max(0,(e.kCd||0)-dt);
    if(e.para>0){e.para-=dt;if(e.state!=='air'&&e.state!=='down'){e.state='para'}if(Math.random()<dt*30)trailP(e.x+rnd(-.4,.4),e.y+rnd(.2,2)*T.scale,e.z+rnd(-.4,.4),0x8ab4ff,1,.3,.25,PA,1.2)}
    e.slow=Math.max(0,e.slow-dt);e.root=Math.max(0,e.root-dt);e.flash=Math.max(0,e.flash-dt);e.hit=Math.max(0,e.hit-dt);
    e.atkCd=Math.max(0,e.atkCd-dt);e.slamCd=Math.max(0,e.slamCd-dt);
    const tg=pickT(e);
    const dx=tg.x-e.x,dz=tg.z-e.z,d=Math.hypot(dx,dz)||.01,toP=Math.atan2(dx,dz);
    let mx=0,mz=0;
    const turn=(r)=>{e.face+=angDiff(toP,e.face)*(1-Math.exp(-dt*r))};
    switch(e.state){
      case 'move':{
        turn(9);
        if(e.stun>0){e.state='stagger';break}
        const sp=T.spd*(e.slow>0?.45:1)*(e.root>0?0:1)*(tg.dead?0:1);
        const near=T.reach*.75;
        if(e.type==='mage'){
          if(d<7){mx=-dx/d*sp;mz=-dz/d*sp}else if(d>10){mx=dx/d*sp;mz=dz/d*sp}
          const sd=(e.ph>3?1:-1);mx+=-dz/d*sp*.5*sd;mz+=dx/d*sp*.5*sd;
          if(!tg.dead&&e.atkCd<=0&&d<18&&G.attackers<3&&e.root<=0){e.state='cast';e.st=.9;e.atkCd=rnd(1.8,3);e.castN=3}
          break;
        }
        if(d>near){mx=dx/d*sp;mz=dz/d*sp}
        else if(d<near*.6){mx=-dx/d*sp*.4;mz=-dz/d*sp*.4}
        if(G.attackers>=2&&d<5.5&&d>1){const s2=(e.ph>3?1:-1);mx+=-dz/d*sp*.55*s2;mz+=dx/d*sp*.55*s2;mx-=dx/d*sp*.3;mz-=dz/d*sp*.3}
        if(!tg.dead&&e.atkCd<=0&&G.attackers<2&&e.root<=0){
          if(e.T.kind&&e.kCd<=0&&e.spawnT<=0){bossKind(e,tg,d)}
          else if(e.type==='boss'&&e.slamCd<=0&&d<10){startSlam(e,4.6,1)}
          else if(e.type==='boss'&&e.spCd<=0&&d>4){e.state='cast';e.st=1;e.spCd=rnd(5,8);e.castN=7}
          else if(e.type==='brute'&&e.spCd<=0&&d<9&&d>2.5){
            if(Math.random()<.5){startSlam(e,3.6,.9);e.spCd=rnd(5,8)}else{e.state='chargewind';e.st=.7;e.spCd=rnd(6,9);callout('Bruto vai investir!','#ff9a3a')}
          }
          else if(e.type==='grunt'&&e.spCd<=0&&d>3.2&&d<9){e.state='leapwind';e.st=.5;e.spCd=rnd(4,7)}
          else if(d<T.reach+.8){e.state='windup';e.st=T.windup}
        }
        break;}
      case 'cast':
        turn(12);e.st-=dt;if(e.stun>0&&e.type!=='boss'){e.state='stagger';break}
        if(e.st<=0){
          const n=e.castN||1;
          if(e.type==='boss'){for(let i=0;i<n;i++)eshoot(e,e.face+(i-(n-1)/2)*.2,13,T.dmg*.7,0xff4a2a)}
          else{const f=e.face;eshoot(e,f,15,T.dmg,0x4af0ff);later(.16,()=>{if(!e.dead)eshoot(e,e.face,15,T.dmg,0x4af0ff)});later(.32,()=>{if(!e.dead)eshoot(e,e.face,15,T.dmg,0x4af0ff)})}
          e.state='recover';e.st=.6;
        }
        break;
      case 'leapwind':
        turn(14);e.st-=dt;if(e.stun>0){e.state='stagger';break}
        if(e.st<=0){e.state='leap';e.st=.8;e.hitL=false;e.vx=dx/d*17;e.vz=dz/d*17;e.vy=9;e.y=.01;dust(e.x,e.z,6,.6)}
        break;
      case 'leap':
        e.st-=dt;
        if(!e.hitL&&Math.hypot(tg.x-e.x,tg.z-e.z)<T.reach+.35&&Math.abs(tg.y-e.y)<1.8){e.hitL=true;hitT(tg,e,T.dmg*1.5*e.dmgMul,{stun:.4,kb:8})}
        break;
      case 'chargewind':
        turn(14);e.st-=dt;if(e.stun>0){e.state='stagger';break}
        if(Math.random()<dt*30)dust(e.x,e.z,1,.5);
        if(e.st<=0){e.state='charge';e.st=.9;e.cx=dx/d;e.cz=dz/d;e.hitL=false}
        break;
      case 'charge':
        e.face=Math.atan2(e.cx,e.cz);mx=e.cx*13;mz=e.cz*13;e.st-=dt;
        if(Math.random()<dt*40)dust(e.x,e.z,2,.7);
        if(!e.hitL&&Math.hypot(tg.x-e.x,tg.z-e.z)<T.reach+.3&&Math.abs(tg.y-e.y)<1.8){e.hitL=true;hitT(tg,e,T.dmg*1.5*e.dmgMul,{stun:.5,kb:11})}
        if(Math.hypot(e.x,e.z)>ARENA_R-1.3){e.state='stagger';e.stun=1.3;shake(.6);crack(e.x,e.z,2,0xffd9a0,1,.7);debris(e.x,e.z,0x5a4630,6,7);callout('Bruto bateu na parede!','#ffe27a')}
        else if(e.st<=0){e.state='recover';e.st=.8}
        break;
      case 'para':
        if(e.para<=0){e.state='move';e.atkCd=.5}
        break;
      case 'windup':
        if(e.stun>0){e.state='stagger';break}
        if(e.st>.2)turn(12);
        e.st-=dt;if(e.st<=0){e.state='strike';e.st=.2;e.struck=false}
        break;
      case 'strike':{
        if(!e.struck){
          e.struck=true;
          const dd=Math.hypot(tg.x-e.x,tg.z-e.z);
          if(dd<T.reach+.55&&Math.abs(angDiff(Math.atan2(tg.x-e.x,tg.z-e.z),e.face))<1.1&&Math.abs(tg.y-e.y)<1.8)hitT(tg,e,T.dmg*e.dmgMul,{stun:.3});
          puff(e.x+sn(e.face)*T.reach*.6,1.2,e.z+cs(e.face)*T.reach*.6,0xffffff,4,3,.2,.18,0);
          e.vx+=sn(e.face)*3;e.vz+=cs(e.face)*3;
        }
        e.st-=dt;if(e.st<=0){e.state='recover';e.st=.5}
        break;}
      case 'slamwind':
        turn(5);e.st-=dt;
        if(e.stun>0&&e.type!=='boss'){e.state='stagger';break}

  else if(st==='down'){tilt=-1.45;ra=la=.3}

function shoot(o){

  const p=Object.assign({vis:G.vis,vP:P,x:P.x,y:P.y+1.2,z:P.z,vx:sn(yaw)*sp,vy:0,vz:cs(yaw)*sp,r:.6,life:1.2,dmg:10,knock:6,stun:.3,pierce:false,col:0xffffff,size:.4,grav:0,t:0,fl:{}},o);
  p.hit=new Set();if(!p.trailCol)p.trailCol=p.col;

    p.mesh=mk(GEO.sph,gmat(p.col,.95),p.x,p.y,p.z,p.size);
    const h=new THREE.Mesh(GEO.sph,gmat(p.col,.28));h.scale.setScalar(1.9);p.mesh.add(h);
  }
  G.proj.push(p);return p;
}
function updateProj(dt){
  const L=G.proj;
  for(let i=L.length-1;i>=0;i--){
    const p=L[i];p.t+=dt;
    const pv0=G.vis,pP0=P;G.vis=!!p.vis;if(p.vis)P=p.vP;
    if(p.upd)p.upd(p,dt);
    p.vy-=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.mesh&&!p.nomove)p.mesh.position.set(p.x,p.y,p.z);
    if(!p.notrail&&Math.random()<.9)trailP(p.x,p.y,p.z,p.trailCol,1,(p.size||.4)*.9,.3,PA,.5);
    const sl=Math.hypot(p.vx,p.vz)||1;
    for(const e of G.en){
      if(e.dead||p.hit.has(e))continue;
      const dx=e.x-(p.hx!=null?p.hx:p.x),dz=e.z-(p.hz!=null?p.hz:p.z),hh=2.5*e.T.scale;
      if(Math.hypot(dx,dz)<p.r+e.T.r&&p.y>e.y-.6&&p.y<e.y+hh+.4){
        p.hit.add(e);
        hitEnemy(e,Object.assign({dmg:p.dmg*(P.el==='agua'&&e.wet>0?1.25:1),knock:p.knock,stun:p.stun,dirx:p.vx/sl,dirz:p.vz/sl,col:p.dcol||'#fff',big:p.dmg>=20},p.fl));
        if(p.onHit)p.onHit(e,p);
        if(!p.pierce){p.dead=true;break}
      }
    }
    if(p.grav&&p.y<.2&&p.t>.05)p.dead=true;
    if(Math.hypot(p.x,p.z)>ARENA_R+3)p.dead=true;
    if(p.t>=p.life||p.dead){
      if(p.onEnd)p.onEnd(p);
      if(p.mesh)rm(p.mesh);
      L.splice(i,1);

}

function zoneFx(x,z,R,dur,col,o){

  addFx({dur,update(f,dt){
    const out=f.t>dur-.4?Math.max(0,(dur-f.t)/.4):1;disc.material.opacity=.28*out*(.8+.2*sn(f.t*6));

    dbc.collection('fr').where('from','==',me.uid).onSnapshot(s=>{out=s.docs.map(x=>x.data());merge()},()=>{});

async function addFriend(raw){
  const n=raw.trim();
  if(!/^[A-Za-z0-9_.-]{3,16}$/.test(n))return'Digite o nome exato do seu amigo.';
  if(!dbc||!me.uid)return'Amigos precisam de conexão com o servidor.';
  if(n.toLowerCase()===me.name.toLowerCase())return'Esse é você.';
  try{
    const s=await dbc.doc('names/'+n.toLowerCase()).get();
    if(!s.exists)return'Ninguém usa esse nome.';
    const t=s.data();
    if(frList().some(f=>f.uid===t.uid))return'Vocês já são amigos.';
    if(MPS.reqOut.some(d=>d.to===t.uid))return'Pedido já enviado.';
    const back=MPS.reqIn.find(d=>d.from===t.uid);
    if(back){await frDoc(t.uid,me.uid).update({st:'a'});return'Vocês agora são amigos!'}
    await frDoc(me.uid,t.uid).set({from:me.uid,to:t.uid,fn:me.name,tn:t.name,st:'p'});
    return'Pedido enviado para '+t.name+'.';
  }catch(e){return'Não consegui enviar. Tente de novo.'}
}

}

function clearRemotes(){for(const q of MPS.rp.values())killRemote(q);MPS.rp.clear();MP.players.length=0}
function killRemote(q){rm(q.rig.root);rm(q.rig.shadow);rm(q.rig.aura)}
async function joinTeam(code,silent){
  if(!MPS.RN)return'off';
  code=String(code||'').toLowerCase().trim();
  if(!/^[a-z0-9]{5}$/.test(code))return'bad';
  if(code===MPS.code)return'same';
  if(G.mode!=='menu')return'busy';
  let nr;try{nr=await MPS.RN.join('t-'+code)}catch(e){return'err'}
  try{await nr.presence({n:me.name,u:me.uid||'',jt:Date.now()})}catch(e){}
  await sleep(1100);
  const ps=nr.peers().filter(p=>p.kind==='viewer');
  const hp=ps.filter(p=>!p.sameTab).map(p=>p.presence).find(x=>x&&x.md);
  if(ps.length>5){try{await nr.leave()}catch(e){}return'full'}
  if(hp&&hp.md!=='menu'){try{await nr.leave()}catch(e){}return'busy'}
  attachTeam(nr,code);
  return'ok';
}
function attachTeam(nr,code){
  for(const u of MPS.subs)try{u()}catch(e){}
  MPS.subs=[];
  const old=MPS.tr;MPS.tr=nr;MPS.code=code;MPS.jt=Date.now();clearRemotes();
  if(old&&old!==nr)old.leave().catch(()=>{});
  nr.presence({n:me.name,u:me.uid||'',jt:MPS.jt,md:G.mode,rd:G.round,x:0,y:0,z:0,f:0,el:'',hp:0,mx:0,d:0,an:0,aa:'',sp:0,pk:0,en:null}).catch(()=>{});
  MPS.subs.push(nr.onPeers(()=>{lobbyRender()}));
  MPS.subs.push(nr.on('ev',onEv));
  MPS.subs.push(nr.on('dmg',onDmg));
  MPS.subs.push(nr.on('pd',onPd));
  MPS.subs.push(nr.on('ep',onEp));
  lobbyRender();
  if(MPS.RN)MPS.RN.presence({t:code}).catch(()=>{});
}

/* ---------- eventos ---------- */
function fromLeader(m){const l=leaderPeer();return l&&m.peer===l.peer&&!m.sameTab}
function onEv(m){
  const d=m.data;if(!d||m.sameTab)return;
  if(d.t==='c'){
    const q=MPS.rp.get(m.peer);if(q&&G.mode!=='over')visCast(q,d);return;
  }
  if(!fromLeader(m))return;
  if(d.t==='start'&&G.mode==='menu')startAt(+d.r||1,+d.sc||0);
  else if(d.t==='clear'&&(G.mode==='fight'||G.mode==='wait')){
    G.mode='clear';G.score=+d.sc||G.score;banner('Round '+G.round+' completo','','#ffe27a');sfx(660,'triangle',.5,.08,300);
    if(!P.dead)heal(35);
  }else if(d.t==='next'&&(G.mode==='clear'||G.mode==='fight')){G.round=(+d.r||G.round+1)-1;nextRound()}
  else if(d.t==='over'&&G.mode!=='over'&&G.mode!=='menu'){G.mode='over';P.dead=true;later(1.2,()=>showEnd())}
}
function onDmg(m){
  if(m.sameTab||!iAmHost()||G.mode!=='fight')return;
  const a=m.data&&m.data.a;if(!Array.isArray(a))return;
  for(const h of a.slice(0,30)){

async function claimName(n){
  const key=n.toLowerCase();
  if(!dbc||!me.uid){lsSet('name',n);return'ok'}
  try{
    const ref=dbc.doc('names/'+key);
    const l=await ref.acquire({holder:me.uid,ttlMs:6000});
    if(!l.acquired)return'busy';
    const sn=await ref.get(),d=sn.exists?sn.data():null;
    if(d&&d.uid&&d.uid!==me.uid)return'taken';
    await ref.set({uid:me.uid,name:n});
    const old=me.name;
    await dbc.doc('data/users/'+me.uid+'/profile').set({name:n});
    if(old&&old.toLowerCase()!==key){try{await dbc.doc('names/'+old.toLowerCase()).delete()}catch(e){}}
    return'ok';
  }catch(e){return'error'}
}

{

function drawHud(dt){

  if(G.cine){const b=H*.12*Math.min(1,G.cine.t*3);hx.fillStyle='#000';hx.fillRect(0,0,W,b);hx.fillRect(0,H-b,W,b)}
  // barras dos inimigos
  for(const e of G.en){
    if(e.dead||e.spawnT>0)continue;
    const p=proj(e.x,e.y+(2.3*e.T.scale)+.5,e.z);if(!p.ok)continue;
    const w=e.type==='boss'?90:50,h=e.type==='boss'?7:5,k=Math.max(0,e.hp/e.max);
    hx.fillStyle='rgba(0,0,0,.65)';hx.fillRect(p.x-w/2-1,p.y-1,w+2,h+2);
    hx.fillStyle=k>.5?'#7ad04a':k>.25?'#ffc15a':'#ff5a4a';hx.fillRect(p.x-w/2,p.y,w*k,h);
    let ic='';if(e.burn>0)ic+='🔥';if(e.wet>0)ic+='💧';if(e.rad>0)ic+='☢';if(e.tox>0)ic+='☠';if(e.root>0)ic+='🌿';
    if(ic){hx.font='12px sans-serif';hx.textAlign='center';hx.fillStyle='#fff';hx.fillText(ic,p.x,p.y-4)}
  }
  // alvo
  if(G.mode==='fight'){
    const t=aimTarget(30);
    if(t){const p=proj(t.x,t.y+(2.9*t.T.scale)+.9,t.z);
      if(p.ok){hx.fillStyle=P.el?EL[P.el].color:'#fff';hx.globalAlpha=.9;hx.beginPath();hx.moveTo(p.x,p.y+9);hx.lineTo(p.x-7,p.y-2);hx.lineTo(p.x+7,p.y-2);hx.closePath();hx.fill();hx.globalAlpha=1}}
  }
  MP.hud(hx);
  // textos flutuantes
  hx.textAlign='center';
  for(let i=G.texts.length-1;i>=0;i--){
    const t=G.texts[i];t.life-=dt;if(t.life<=0){G.texts.splice(i,1);continue}
    const p=proj(t.x,t.y+(.9-t.life)*1.4,t.z);if(!p.ok)continue;
    hx.globalAlpha=Math.min(1,t.life*2.2);hx.font='700 '+t.size+'px "Barlow Condensed",sans-serif';hx.lineWidth=3;hx.strokeStyle='rgba(0,0,0,.8)';
    hx.strokeText(t.txt,p.x,p.y);hx.fillStyle=t.col;hx.fillText(t.txt,p.x,p.y);hx.globalAlpha=1;
  }
  // linhas de velocidade
  const dashing=P.dash||P.dive;
  if(dashing){
    hx.strokeStyle='rgba(255,255,255,.35)';hx.lineWidth=1.5;hx.beginPath();
    for(let i=0;i<22;i++){const a=Math.random()*TAU,r0=Math.min(W,H)*(.28+Math.random()*.1),r1=r0+Math.min(W,H)*(.12+Math.random()*.2);hx.moveTo(W/2+Math.cos(a)*r0*1.3,H/2+Math.sin(a)*r0);hx.lineTo(W/2+Math.cos(a)*r1*1.3,H/2+Math.sin(a)*r1)}
    hx.stroke();
  }
  // vinheta de vida baixa / dano
  const low=P.max?1-P.hp/P.max:0,va=Math.max(P.hurtA*.5,low>.65?(low-.65)*1.2:0);
  if(va>.02){const g=hx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,'rgba(255,30,30,'+Math.min(.7,va)+')');hx.fillStyle=g;hx.fillRect(0,0,W,H)}
  if(G.flashA>.01){hx.fillStyle='rgba('+G.flashCol+','+G.flashA+')';hx.fillRect(0,0,W,H);G.flashA*=Math.exp(-dt*7)}
}
function updateDom(){
  setTxt(elRd,'rd',String(Math.max(1,G.round)));setTxt(elScore,'sc',String(G.score));
  setCss(elHpf,'hpf','transform','scaleX('+clamp(P.hp/P.max,0,1).toFixed(3)+')');setTxt(elHpt,'hpt',String(Math.ceil(Math.max(0,P.hp))));
  setCss(elGdf,'gdf','transform','scaleX('+clamp(P.guard/P.guardMax,0,1).toFixed(3)+')');
  setTxt(elChip,'chip',P.el?EL[P.el].name:'Sem poder');if(cache.chipc!==P.el){cache.chipc=P.el;elChip.style.setProperty('--c',P.el?EL[P.el].color:'')}
  const cb=P.combo>=2?P.combo:0;if(cache.cb!==cb){cache.cb=cb;const c=$('#combo');c.style.opacity=cb?1:0;if(cb)c.innerHTML=cb+'<small>combo x'+comboMul().toFixed(2)+'</small>'}
  if(P.el){
    const bs=elPow.children,pws=EL[P.el].pw;
    for(let i=0;i<bs.length;i++){
      const cd=P.cds[i]||0,ready=cd<=0;
      const k='pw'+i,v=ready?'r':(cd/pws[i].cd).toFixed(2);
      if(cache[k]!==v){cache[k]=v;bs[i].classList.toggle('ready',ready);bs[i].lastChild.style.transform='scaleY('+(ready?0:cd/pws[i].cd)+')'}
    }
  }
}

/* ---------- laço principal ---------- */
let last=performance.now();
let failed=false;
function frame(now){
  if(failed)return;
  try{frameInner(now)}catch(err){failed=true;fail('Algo deu errado: '+(err&&err.message?err.message:err))}
  if(!failed)requestAnimationFrame(frame);
}
function frameInner(now){
  if(document.hidden){last=now;return}
  let dt=Math.min(.05,(now-last)/1000);last=now;if(!(dt>0))return;
  const real=dt;vt+=real;
  if(G.hitstop>0){G.hitstop-=real;dt*=.06}
  G.t+=dt;
  if(G.mode==='menu'||G.mode==='pick')C.yaw+=real*.25;
  MP.update(real);
  if(P.form&&G.mode!=='cine'){P.formT-=dt;P.formElapsed=(P.formElapsed||0)+dt;if(P.formT<=0)endForm()}
  if(G.mode==='cine'){updateCine(dt);updatePlayer(dt);if(MP.on||(G.cine&&G.cine.boss)){updateEnemies(dt);updateProj(dt);updateEProj(dt)}updateFx(dt)}
  else{updatePlayer(dt);updateEnemies(dt);updateProj(dt);updateEProj(dt);updateFx(dt)}
  if(G.mode==='fight'&&(!MP.on||MP.host)&&G.en.length&&!G.en.some(e=>!e.dead))roundClear();
  PA.update(dt);PN.update(dt);
  const us=H*PR/(2*Math.tan(camera.fov*Math.PI/360));PA.mat.uniforms.uScale.value=us;PN.mat.uniforms.uScale.value=us;
  flames.forEach((f,i)=>{const s=1+.25*sn(vt*9+i*1.7);f.scale.set(s,1.2*s,s)});
  crystals.forEach((c,i)=>{c.rotation.y+=real*.8;c.position.y=8.6+sn(vt*1.5+i)*.3});
  updateRig(dt);updateCamera(real);
  renderer.render(scene,camera);
  drawHud(real);updateDom();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){checkpoint();for(const k in keys)keys[k]=false;hs.punch.clear();hs.block.clear()}});
window.addEventListener('pagehide',checkpoint);
if(location.search.indexOf('debug')>=0)window.__dbg={startTransform,endForm,zombieRevive,updateCine,G,P,C,CAST,EL,castSlot,startGame,chooseElement,roundClear,roundList,spawnEnemy,hitEnemy,updatePlayer,updateEnemies,updateProj,updateFx,updateRig,updateCamera,MPS,MP,joinTeam,hostStart,addFriend,answerReq,viewers,iAmHost,die,showMenu};
boot();buildPowers();
requestAnimationFrame(frame);

})();
</script>
